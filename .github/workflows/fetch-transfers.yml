name: Mercato — récupération des transferts

on:
  schedule:
    # Toutes les 15 minutes → ~96 exécutions/jour (sous la limite gratuite de 100).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour tester à la main

permissions:
  contents: write          # nécessaire pour committer data.json

concurrency:
  group: fetch-transfers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les transferts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node fetch.mjs

      - name: Committer data.json s'il a changé
        run: |
          git config user.name "mercato-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "MAJ transferts $(date -u +%FT%TZ)"
            git push
          fi
